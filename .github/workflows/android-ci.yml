name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: >-
          ./gradlew --no-daemon
          :core:common:test :domain:test
          :data:testDebugUnitTest
          :feature:auth:testDebugUnitTest
          :feature:bills:testDebugUnitTest
          :feature:billdetails:testDebugUnitTest
          :feature:contracts:testDebugUnitTest
          :feature:dashboard:testDebugUnitTest
          :feature:paymentpromises:testDebugUnitTest
          :feature:profile:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDevDebug

      - name: Assemble dev debug APK
        run: ./gradlew --no-daemon :app:assembleDevDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14
